<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개미증권 – 모의투자 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1014;--p1:#171a20;--p2:#1e222a;--p3:#262b35;--line:#2a2f3a;--text:#e9ecf1;--dim:#8a92a3;--dim2:#5f6777;--red:#f04452;--blue:#3182f6;--redbg:rgba(240,68,82,.12);--bluebg:rgba(49,130,246,.12);--gold:#f5b942}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;font-size:13px;font-variant-numeric:tabular-nums;overflow:hidden}
button{font:inherit;color:inherit;background:var(--p3);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){filter:brightness(1.15)}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;color:var(--text);background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
input:focus{border-color:var(--blue)}
.up{color:var(--red)}.down{color:var(--blue)}.flat{color:var(--dim)}
.dim{color:var(--dim)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2c313c;border-radius:4px}

/* 상단 바 */
.topbar{height:58px;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--p1);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}
.logo{font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo span{color:var(--red)}
.idx{display:flex;flex-direction:column;line-height:1.25}
.idx small{color:var(--dim);font-size:11px}
.idx b{font-size:14px}
.clock{display:flex;flex-direction:column;line-height:1.25}
.clock b{font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px}
.pill.open{background:rgba(46,204,113,.15);color:#3ddc84}.pill.closed{background:var(--p3);color:var(--dim)}
.speeds{display:flex;gap:4px}
.speeds button{padding:5px 9px;font-size:12px;font-weight:700}
.speeds button.on{background:var(--blue);color:#fff}
.sp{flex:1}
.acct{display:flex;gap:16px;align-items:center}
.acct .k{display:flex;flex-direction:column;line-height:1.25}
.acct .k small{color:var(--dim);font-size:11px}
.acct .k b{font-size:15px}
.acct .k.cash b{color:#3ddc84;font-size:17px}
.tier{background:var(--p3);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;line-height:1.3;min-width:120px}
.tier b{font-size:13px}
.tier .bar{height:4px;background:#0b0d10;border-radius:2px;overflow:hidden;margin-top:3px}
.tier .bar i{display:block;height:100%;background:var(--gold)}
.iconbtn{background:transparent;color:var(--dim);font-size:12px;padding:5px 8px;border:1px solid var(--line)}
label.chk{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px;cursor:pointer}

/* 레이아웃 */
.layout{display:grid;grid-template-columns:330px minmax(0,1fr) 340px;height:calc(100vh - 58px)}
.col{overflow-y:auto;border-right:1px solid var(--line);min-width:0;overscroll-behavior:contain;overflow-anchor:none;-webkit-overflow-scrolling:touch}
.col:last-child{border-right:0}
@media(max-width:1180px){body{overflow:auto}.layout{grid-template-columns:300px 1fr;height:auto}.col{max-height:none;overflow:visible}.col.right{grid-column:span 2;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}}
#mnav,#mtrade,#mAcct,.mhide-d{display:none}
.ohead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ohead b{font-size:15px}


/* 종목 리스트 */
.lhead{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 12px 6px}
.lhead input{width:100%;margin-bottom:8px}
.ltabs{display:flex;gap:4px;flex-wrap:wrap}
.ltabs button{font-size:12px;padding:4px 9px;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:14px}
.ltabs button.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:700}
.lsec{margin-top:6px;width:100%;background:var(--p2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) 60px 82px;align-items:center;gap:6px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #1a1d24}
.row:hover{background:var(--p1)}
.row.sel{background:var(--p2);box-shadow:inset 3px 0 0 var(--blue)}
.row .rk{color:var(--dim2);font-size:12px;text-align:center}
.row .nm{overflow:hidden}
.row .nm b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--dim);font-size:11px}
.row .nm .own{color:#3ddc84;font-size:11px;margin-left:4px}
.row .pr{text-align:right;line-height:1.3}
.row .pr b{display:block;font-weight:500;border-radius:4px;padding:0 3px;margin-right:-3px}
.row .pr small{font-size:12px}
.row svg{display:block}
.fu{animation:fu .5s}.fd{animation:fd .5s}
@keyframes fu{0%{background:rgba(240,68,82,.45)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(49,130,246,.45)}100%{background:transparent}}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:4px;vertical-align:1px;margin-left:3px}
.badge.lu{background:var(--red);color:#fff}.badge.ld{background:var(--blue);color:#fff}
.badge.mk{background:var(--p3);color:var(--dim)}
.badge.etf{background:#2b2440;color:#b9a3ff}
.badge.earn{background:#3a3012;color:var(--gold)}

/* 상세 */
.detail{padding:16px 18px}
.dh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dh .t h1{margin:0;font-size:21px;font-weight:700;display:flex;align-items:center;gap:6px}
.dh .t small{color:var(--dim)}
.fav{background:transparent;font-size:20px;padding:0 4px;color:var(--dim2)}
.fav.on{color:var(--gold)}
.bigp{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-top:6px}
.bigc{font-size:15px;font-weight:500}
.myline{margin-left:auto;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:230px}
.myline .h{color:var(--dim);font-size:12px;margin-bottom:4px}
.myline b{font-size:16px}
.info{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 14px;margin:14px 0;background:var(--p1);border-radius:12px;padding:12px 14px}
@media(max-width:1400px){.info{grid-template-columns:repeat(3,1fr)}}
.info div{display:flex;justify-content:space-between;gap:6px;font-size:12.5px}
.info div span{color:var(--dim)}
.desc{color:var(--dim);font-size:12.5px;margin:-4px 0 12px}
.card{background:var(--p1);border-radius:14px;padding:12px 14px}
.ctabs{display:flex;gap:4px;margin-bottom:8px;align-items:center}
.ctabs button{font-size:12px;padding:4px 10px;background:transparent;color:var(--dim)}
.ctabs button.on{background:var(--p3);color:var(--text);font-weight:700}
.ctabs .r{margin-left:auto;color:var(--dim);font-size:12px}
#chart{width:100%;height:330px;display:block;cursor:crosshair}
.bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:12px}
@media(max-width:1400px){.bottom{grid-template-columns:1fr}}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .tb{margin-left:auto;display:flex;gap:4px}
.card h3 .tb button{font-size:12px;padding:3px 9px;background:transparent;color:var(--dim);font-weight:500}
.card h3 .tb button.on{background:var(--p3);color:var(--text);font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid #20242c;font-size:12.5px}
th{color:var(--dim);font-weight:500;font-size:11.5px}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--p2)}
.empty{color:var(--dim);text-align:center;padding:22px 0}
.mini{font-size:11px;padding:2px 7px}
.news{display:flex;flex-direction:column}
.news .n{padding:8px 0;border-bottom:1px solid #20242c;display:flex;gap:8px}
.news .n:last-child{border:0}
.news .n time{color:var(--dim);font-size:11px;flex:none;width:62px}
.news .n .tx{font-size:12.5px;line-height:1.45}
.tag{display:inline-block;white-space:nowrap;font-size:10.5px;padding:0 5px;border-radius:4px;margin-left:4px}
.tag.p{background:var(--redbg);color:var(--red)}.tag.n{background:var(--bluebg);color:var(--blue)}

/* 오른쪽: 호가 & 주문 */
.right{padding:12px}
.ob{background:var(--p1);border-radius:14px;padding:10px 0 6px;margin-bottom:12px}
.ob h3{margin:0 12px 6px;font-size:14px;display:flex;justify-content:space-between}
.ob h3 small{color:var(--dim);font-weight:400;font-size:11.5px}
.obr{display:grid;grid-template-columns:1fr 92px 1fr;align-items:center;height:24px;font-size:12.5px;cursor:pointer;position:relative}
.obr:hover{outline:1px solid #39404d;outline-offset:-1px}
.obr .q{position:relative;padding:0 8px;height:100%;display:flex;align-items:center}
.obr .q i{position:absolute;top:3px;bottom:3px;opacity:.35}
.obr.ask .q.l{justify-content:flex-end}
.obr.ask .q.l i{right:0;background:var(--blue)}
.obr.bid .q.r i{left:0;background:var(--red)}
.obr .q span{position:relative}
.obr .pp{text-align:center;font-weight:500;height:100%;display:flex;align-items:center;justify-content:center}
.obr.ask .pp{background:rgba(49,130,246,.07)}.obr.bid .pp{background:rgba(240,68,82,.07)}
.obr.cur .pp{outline:1.5px solid var(--text);outline-offset:-2px;border-radius:3px;font-weight:800}
.obr .pct{font-size:10.5px;margin-left:4px;opacity:.8}
.ticks{background:var(--p1);border-radius:14px;padding:10px 12px;margin-top:12px}
.ticks h3{margin:0 0 6px;font-size:14px}
.tk{display:grid;grid-template-columns:60px 1fr 1fr;font-size:12px;padding:2px 0}
.tk span:nth-child(2),.tk span:nth-child(3){text-align:right}
.order{background:var(--p1);border-radius:14px;padding:12px}
.otabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.otabs button{padding:9px;font-weight:700;font-size:14px;background:var(--p2);color:var(--dim)}
.otabs button.on.buy{background:var(--red);color:#fff}
.otabs button.on.sell{background:var(--blue);color:#fff}
.otype{display:flex;gap:4px;margin-bottom:10px}
.otype button{flex:1;font-size:12px;padding:5px;background:transparent;border:1px solid var(--line);color:var(--dim)}
.otype button.on{border-color:var(--text);color:var(--text);font-weight:700}
.fl{color:var(--dim);font-size:12px;margin:6px 0 4px;display:flex;justify-content:space-between}
.stepper{display:grid;grid-template-columns:36px 1fr 36px;gap:4px}
.stepper input{text-align:right;width:100%;font-size:14px;font-weight:500}
.stepper button{font-size:16px;padding:0}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.pcts button{font-size:12px;padding:5px 0;background:var(--p2)}
.osum{margin:12px 0 10px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.osum div{display:flex;justify-content:space-between}
.osum div span{color:var(--dim)}
.osum .big b{font-size:15px}
.submit{width:100%;padding:12px;font-size:15px;font-weight:800;color:#fff}
.submit.buy{background:var(--red)}.submit.sell{background:var(--blue)}

/* 큰 속보 배너 */
#bigNews{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px) scale(.96);opacity:0;pointer-events:none;z-index:45;width:min(620px,94vw);
  border-radius:16px;padding:14px 18px;text-align:center;box-shadow:0 16px 50px rgba(0,0,0,.6);transition:.25s;cursor:pointer}
#bigNews.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#bigNews.p{background:linear-gradient(135deg,#b4232f,#f04452)}#bigNews.n{background:linear-gradient(135deg,#1b4fa8,#3182f6)}
#bigNews.show .bn-lb{animation:flash .8s 3}
.bn-lb{display:inline-block;font-size:12px;font-weight:800;background:rgba(0,0,0,.25);padding:2px 10px;border-radius:10px;margin-bottom:6px}
.bn-t{font-size:20px;font-weight:800;line-height:1.35}
.bn-f{margin-top:8px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bn-f span{background:rgba(255,255,255,.18);border-radius:6px;padding:1px 7px}
/* 세계 정세 */
.world{background:var(--p1);border-radius:12px;margin:10px 12px 0;padding:8px 10px}
.world h4{margin:0 0 4px;font-size:12.5px;color:var(--dim);font-weight:500;display:flex;justify-content:space-between}
.wst{padding:6px 2px;border-top:1px solid #22262e;font-size:12.5px}
.wst:first-of-type{border-top:0}
.wst b{font-size:13px}
.wst .stage{color:var(--dim);font-size:11.5px;margin:2px 0}
.wst .tg{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;margin:2px 3px 0 0}
.wst.done{opacity:.55}
/* 알림 */
#toasts{position:fixed;bottom:14px;left:14px;display:flex;flex-direction:column-reverse;gap:8px;z-index:40;pointer-events:none;width:min(340px,92vw)}
.toast{pointer-events:auto;background:rgba(36,40,50,.97);backdrop-filter:blur(6px);border:1px solid #363c48;border-radius:14px;padding:11px 13px;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer;animation:tin .25s ease;position:relative}
.toast.out{animation:tout .25s ease forwards}
@keyframes tin{from{opacity:0;transform:translateY(20px)}}
@keyframes tout{to{opacity:0;transform:translateX(-30px)}}
.toast .th{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.toast .th b{color:var(--text);font-size:12px}
.toast .th .lb{font-weight:800;padding:0 6px;border-radius:4px;font-size:11px;color:#fff}
.toast .tt{font-size:13.5px;font-weight:700;line-height:1.4}
.toast .tf{margin-top:5px;font-size:12px;color:var(--dim)}
.toast .x{position:absolute;right:8px;top:6px;background:transparent;color:var(--dim2);padding:0 4px}

/* 로그인 · 랭킹 */
.login{text-align:center;width:min(380px,100%)}
.lg-logo{font-size:30px;font-weight:800;letter-spacing:-.5px}.lg-logo span{color:var(--red)}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--p2);border-radius:10px;padding:4px;margin:16px 0 12px}
.lg-tabs button{background:transparent;color:var(--dim);font-weight:700}
.lg-tabs button.on{background:var(--p3);color:var(--text)}
#lgForm,#suForm{display:flex;flex-direction:column;gap:8px}
#lgForm input,#suForm input{padding:12px;font-size:15px}
.lg-err{color:var(--red);font-size:12.5px;min-height:17px;text-align:left}
.lg-guest{background:transparent;color:var(--dim);margin-top:12px;font-size:12.5px;text-decoration:underline}
.lg-note{font-size:11.5px;color:var(--dim2);margin-top:10px;line-height:1.5}
.user{display:flex;align-items:center;gap:8px;background:var(--p2);border-radius:10px;padding:5px 10px;font-size:12px}
.user b{font-size:13px}
.sync{font-size:11px;color:var(--dim)}.sync.err{color:var(--red)}
.rk-me{background:var(--p2);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.rk-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid #22262e}
.rk-row.me{background:rgba(49,130,246,.12);border-radius:8px}
.rk-row .no{font-weight:800;text-align:center;color:var(--dim)}
.rk-row .no.top{font-size:18px}
.rk-row .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-row .nm small{color:var(--dim);font-size:11.5px}
.rk-row .v{text-align:right}.rk-row .v small{display:block;font-size:12px}
/* 칸 크기 고정: 숫자가 바뀌어도 레이아웃이 흔들리지 않게 */
.idx{width:122px;flex:none}
.clock{width:168px;flex:none}
.acct .k{width:104px;flex:none;overflow:hidden}
.acct .k b,.acct .k small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.acct .k.cash{width:118px}
.acct .k.loan{width:150px}
.acct .k.room{width:230px}
.tier{width:178px;flex:none}
.user{width:210px;flex:none;overflow:hidden;white-space:nowrap}
.world{height:150px;overflow-y:auto}
#ticks{height:184px;overflow:hidden}
.news{height:300px;overflow-y:auto}
.myline{width:270px;min-height:96px;flex:none}
.osum{min-height:178px}
#acctBody{min-height:120px}
#acctBody table{table-layout:fixed}
#acctBody td,#acctBody th{overflow:hidden;text-overflow:ellipsis}
.bigp{min-height:44px}
/* 모드 · 멀티 */
.only-multi{display:none!important}
body.multi .only-multi{display:revert!important}
body.multi .k.only-multi{display:flex!important}
body.multi .only-solo{display:none!important}
.modes{display:grid;gap:10px;margin:18px 0 6px}
.mode{display:grid;grid-template-columns:48px 1fr;grid-template-rows:auto auto;text-align:left;gap:2px 12px;padding:14px;background:var(--p2);border:1px solid var(--line);border-radius:14px}
.mode i{grid-row:span 2;font-style:normal;font-size:32px;align-self:center;text-align:center}
.mode b{font-size:16px}.mode small{color:var(--dim);line-height:1.5}
.mode:hover:not(:disabled){border-color:var(--blue)}
.lg-link{background:transparent;color:var(--blue);font-weight:700;padding:2px 4px}
.code{font-size:38px;font-weight:800;letter-spacing:8px;text-align:center;background:var(--p2);border-radius:14px;padding:12px;margin:10px 0}
.plist{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.plist div{display:flex;justify-content:space-between;align-items:center;background:var(--p2);border-radius:10px;padding:10px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.seg button{padding:9px;background:var(--p2);border:1px solid var(--line);color:var(--dim)}
.seg button.on{border-color:var(--blue);color:var(--text);font-weight:700}
.rules{font-size:12.5px;color:var(--dim);line-height:1.7;background:var(--p2);border-radius:10px;padding:10px 12px;text-align:left}
.score{background:var(--p1);border-radius:12px;margin:10px 12px 0;padding:8px 10px}
.score h4{margin:0 0 4px;font-size:12.5px;color:var(--dim);font-weight:500;display:flex;justify-content:space-between}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 2px;font-size:12.5px}
.srow.me{background:rgba(49,130,246,.13);border-radius:6px}
.srow .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px;background:#3ddc84;vertical-align:1px}.srow .dot.off{background:#555}
.srow .bk{color:var(--dim2);text-decoration:line-through}
.rumorbtn{font-size:12px;padding:4px 9px;background:#3a2a12;color:var(--gold);font-weight:700;margin-left:4px}
.k.loan b{color:#ffb020}
.credit-warn{font-size:11.5px;color:#ffb020;line-height:1.5;margin-top:4px}
#countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.7);z-index:60;font-weight:800}
#countdown.show{display:flex}#countdown b{font-size:90px}#countdown span{color:var(--dim);font-size:16px}
/* 모달 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex}
.modal{background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .sub{color:var(--dim);margin-bottom:14px}
.modal .big{font-size:28px;font-weight:800}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.mgrid div{background:var(--p2);border-radius:10px;padding:10px 12px}
.mgrid small{display:block;color:var(--dim);font-size:11.5px}
.mgrid b{font-size:15px}
.mlist{background:var(--p2);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.mlist h4{margin:2px 0 6px;font-size:12.5px;color:var(--dim);font-weight:500}
.mlist div{display:flex;justify-content:space-between;padding:3px 0}
.mbtn{width:100%;padding:12px;font-size:15px;font-weight:800;background:var(--blue);color:#fff;margin-top:6px}
.tut{font-size:15px;line-height:1.7;min-height:130px}
.tut .em{font-size:40px;display:block;margin-bottom:6px}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--p3)}.dots i.on{background:var(--text)}
@media(max-width:760px){
  body{overflow:hidden;font-size:13.5px}
  .topbar{height:auto;flex-wrap:wrap;gap:6px 14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;overflow:visible}
  .logo,.topbar label.chk,.topbar .sp,#helpBtn,#resetBtn,#rankBtn,#menuBtn,.topbar .user,.tier,.idx:nth-child(3){display:none!important}
  .acct .k,.acct .k.cash,.acct .k.loan,.acct .k.room{width:auto}
  .acct .k.room{grid-column:span 3;order:9}
  .acct .k.loan{grid-column:span 2;order:8}
  .world{height:104px}
  .myline{width:100%}
  .topbar{overflow-x:hidden}
  .acct .k{min-width:0;overflow:hidden}
  .acct .k b,.acct .k small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .speeds{margin-left:auto}
  .speeds button{padding:5px 8px}
  .acct{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .acct .k{background:var(--p2);border-radius:10px;padding:5px 8px}
  .acct .k b{font-size:14px}.acct .k.cash b{font-size:15px}
  .layout{display:block;height:calc(100dvh - var(--toph,110px) - 60px - env(safe-area-inset-bottom))}
  .col{display:none;height:100%;overflow-y:auto;border:0}
  .col.right{display:none;grid-template-columns:1fr}
  body.t-list .col.left,body.t-chart .col.mid,body.t-order .col.right,body.t-acct .col.mid{display:block}
  .col.left{max-height:none}
  body.t-acct .col.mid .detail>*:not(.bottom){display:none}
  body.t-acct .bottom>.card:last-child{display:none}
  body.t-chart .bottom>.card:first-child{display:none}
  body.t-chart .col.mid{padding-bottom:64px}

  body.t-acct #mAcct{display:block;margin-bottom:12px}
  .detail{padding:12px}
  body.t-chart .detail{display:flex;flex-direction:column}
  body.t-chart .dh{order:1}body.t-chart #chartCard{order:2;margin-top:12px}body.t-chart .info{order:3}body.t-chart .desc{order:4}body.t-chart .bottom{order:5}
  .myline{padding:8px 12px}
  .dh .bigp{font-size:26px}
  .myline{margin-left:0;width:100%}
  .info{grid-template-columns:repeat(2,1fr);gap:6px 12px}
  #chart{height:260px}
  .bottom{grid-template-columns:1fr}
  .right{padding:10px}

  .ticks{display:none}
  .col.right{display:none}
  body.t-order .col.right{display:flex;flex-direction:column;gap:12px}
  body.t-order .col.right .ob{margin:0}
  .mhide-d{display:flex}
  #mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(60px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--p1);border-top:1px solid var(--line);z-index:30}

  #mtrade{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));padding:8px 12px;background:linear-gradient(transparent,var(--bg) 30%);z-index:29;grid-template-columns:1fr 1fr;gap:8px}

  th,td{padding:7px 4px}
}

const pick=a=>a[Math.floor(R()*a.length)];
const uRnd=(a,b)=>a+Math.random()*(b-a);
function uGauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function tickSize(p){return p<2000?1:p<5000?5:p<20000?10:p<50000?50:p<200000?100:p<500000?500:1000;}
const rt=p=>{const t=tickSize(p);return Math.round(p/t)*t;};
const fmt=n=>Math.round(n).toLocaleString();
function won(n,sign){const a=Math.abs(n),s=n<0?'-':(sign&&n>0?'+':'');
  if(a>=1e12)return s+(a/1e12).toFixed(1)+'조';
  if(a>=1e8)return s+(a/1e8).toFixed(a>=1e10?1:2).replace(/\.?0+$/,'')+'억';
  if(a>=1e4)return s+Math.round(a/1e4).toLocaleString()+'만';
  return s+Math.round(a).toLocaleString()+'원';}
const pct=(x,d=2)=>(x>0?'+':'')+(x*100).toFixed(d)+'%';
const cls=x=>x>1e-9?'up':x<-1e-9?'down':'flat';
const arrow=x=>x>1e-9?'▲':x<-1e-9?'▼':'';

function fmtDate(ms){const d=new Date(ms);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${DOW[d.getDay()]})`;}
const hm=m=>{const t=540+m;return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};

function makeStocks(date){
  const out=[];
  DEFS.forEach((d,i)=>{
    const [n,s,m,p,v,cap,per,desc,kind]=d;
    const theme=s==='테마', def=s==='유통'||s==='통신';
    const st={i,code:String(100000+((i+3)*48271)%899999).padStart(6,'0'),n,s,m,v,per,desc,kind:kind||null,
      b:kind?0:theme?.6:def?.55:m==='KOSDAQ'?1.2:1,
      shares:cap?cap*1e12/p:0, avgVol:0, p, prev:p, o:p, h:p, l:p, vol:0, val:0, mins:[], daily:[], fav:false,
      nextEarn:kind?null:Math.floor(rnd(3,55)), earnMin:Math.floor(rnd(30,380)), alerted:0};
    const turn=kind?.01:theme?.05:cap>=20?.0025:cap>=3?.006:.02;
    st.avgVol=kind?rnd(3e6,1.5e7)/p*1000:cap*1e12*turn/p;
    // 과거 120일 일봉 생성
    let c=p, arr=[];
    for(let k=0;k<120;k++){const o=c*(1+gauss()*v*.2), cl=o*Math.exp(gauss()*(v||.01)+.0003);
      arr.push({o,c:cl,h:Math.max(o,cl)*(1+Math.abs(gauss())*v*.5),l:Math.min(o,cl)*(1-Math.abs(gauss())*v*.5),v:st.avgVol*rnd(.5,1.6)}); c=cl;}
    const f=p/c; arr.forEach(x=>{x.o=rt(x.o*f);x.c=rt(x.c*f);x.h=rt(x.h*f);x.l=rt(x.l*f);x.date=0;});
    let dt=date; for(let k=arr.length-1;k>=0;k--){do{dt-=864e5;}while([0,6].includes(new Date(dt).getDay())); arr[k].date=dt;}
    st.daily=arr; st.prev=arr[arr.length-1].c; st.p=st.prev;
    out.push(st);
  });
  return out;
}

function pack(nClose=60,nNews=20){

    orders:S.orders,realized:Math.round(S.realized),fills:S.fills.slice(0,25),nid:S.nid,oid:S.oid,idx:S.idx,tier:S.tier,tutDone:S.tutDone,startEq:Math.round(S.startEq),
    news:S.news.slice(-nNews),stories:S.stories,
    st:S.stocks.map(s=>[Math.round(s.p*100)/100,s.prev,s.o,s.h,s.l,Math.round(s.vol),Math.round(s.val),s.nextEarn,s.earnMin,s.fav?1:0,s.daily.slice(-nClose).map(d=>d.c)])});
  return str.length>48000&&nClose>20?pack(nClose-15,Math.max(5,nNews-5)):str;
}
function unpack(str){
  const d=JSON.parse(str); if(!d||d.v!==1||!d.st||d.st.length!==DEFS.length) return null;
  const st=Object.assign(baseState(),{day:d.day,date:d.date,minute:d.minute,phase:d.phase,cash:d.cash,holds:d.holds||{},orders:d.orders||[],
    realized:d.realized||0,fills:d.fills||[],nid:d.nid||1,oid:d.oid||1,idx:d.idx,tier:d.tier,tutDone:d.tutDone,startEq:d.startEq,news:d.news||[],stories:d.stories||[],savedAt:d.savedAt});
  st.stocks=makeStocks(d.date);
  let end=d.date; if(d.phase!=='closed'){ do{end-=864e5;}while([0,6].includes(new Date(end).getDay())); }
  st.stocks.forEach((s,i)=>{ const [p,prev,o,h,l,vol,val,ne,em,fav,closes]=d.st[i];
    Object.assign(s,{p,prev,o,h,l,vol,val,nextEarn:ne,earnMin:em,fav:!!fav});
    const dates=[]; let dt=end; for(let k=0;k<closes.length;k++){ dates.unshift(dt); do{dt-=864e5;}while([0,6].includes(new Date(dt).getDay())); }
    s.daily=closes.map((c,k)=>{ const pc=k?closes[k-1]:c, op=rt(pc*(1+uGauss()*s.v*.15));
      return {o:op,c,h:rt(Math.max(op,c)*(1+Math.abs(uGauss())*s.v*.4)),l:rt(Math.min(op,c)*(1-Math.abs(uGauss())*s.v*.4)),v:s.avgVol*uRnd(.5,1.6),date:dates[k]}; });
    // 장중 분봉은 저장하지 않으므로 시가→현재가를 자연스럽게 이어서 복원
    const m=d.phase==='closed'?MPD:d.minute, P=rt(p); s.mins=[];
    for(let k=0;k<=m;k++){ const t=m?k/m:1; let v=o+(P-o)*t+uGauss()*o*s.v*.12*Math.sin(Math.PI*t); v=Math.min(h,Math.max(l,v)); s.mins.push({p:k===m?P:rt(v),v:vol/(m+1)}); }
  });
  return st;
}

const px=s=>rt(s.p);
const chg=s=>px(s)/s.prev-1;

const reservedCash=()=>S.orders.filter(o=>o.side==='buy'&&!o.credit).reduce((a,o)=>a+o.price*o.q*1.00015,0);

// ===================== 시뮬레이션 =====================
let effMap={};
function buildEff(){
  effMap={};
  S.events.forEach(e=>{const fast=e.age<e.tau*8?Math.exp(-e.age/e.tau)/e.tau:0, slow=e.age<e.days*MPD?1/MPD:0;
    for(const k in e.tgt){const v=e.tgt[k]; effMap[k]=(effMap[k]||0)+v*fast+v*.12*slow;}});
}
const eff=k=>effMap[k]||0;
function addEvent(tgt,days=2,tau=10){S.events.push({tgt,age:0,tau,days});}
function stepMinute(){
  applyRumors(); resolvePending();
  const sq=Math.sqrt(MPD), m=S.minute;
  const u=1+1.6*Math.exp(-m/25)+1.0*Math.exp(-(MPD-m)/20); // 장 초반·막판 거래 집중
  buildEff(); pumpStep();
  const mz=gauss()*.009/sq+eff('ALL'), secZ={};
  SECTORS.forEach(k=>secZ[k]=gauss()*.007/sq+eff('sec:'+k));
  let kw=0,kr=0,qw=0,qr=0; const secR={},secN={};
  S.stocks.forEach(s=>{ if(s.kind) return;
    const r=s.b*mz+secZ[s.s]+eff('code:'+s.code)+gauss()*s.v/sq*.85*D().vol+.0002/MPD;
    const rr=apply(s,r,u); const w=Math.sqrt(s.shares*s.prev);
    if(s.m==='KOSPI'){kw+=w;kr+=w*rr;} else {qw+=w;qr+=w*rr;}
    secR[s.s]=(secR[s.s]||0)+rr; secN[s.s]=(secN[s.s]||0)+1; });
  const kR=kr/kw, qR=qr/qw;
  S.idx.k*=Math.exp(kR); S.idx.q*=Math.exp(qR);
  S.stocks.forEach(s=>{ if(!s.kind) return; let r;
    if(s.kind==='idx') r=kR+gauss()*s.v/sq;
    else if(s.kind==='lev') r=2*kR+gauss()*s.v/sq;
    else if(s.kind==='inv') r=-kR+gauss()*s.v/sq;
    else if(s.kind.startsWith('sec:')){const k=s.kind.slice(4); r=secR[k]/secN[k]+gauss()*s.v/sq;}
    else if(s.kind==='gold') r=-.25*mz+eff('sec:금')+gauss()*s.v/sq;
    else r=.15*mz+eff('sec:원유')+gauss()*s.v/sq;
    apply(s,r,u); });
  S.events.forEach(e=>e.age++); S.events=S.events.filter(e=>e.age<Math.max(e.tau*8,e.days*MPD));
  rollNews(); if(!replay){ processOrders(); checkMargin(); checkAlerts(); }
  S.minute++;
}
function apply(s,r,u){
  const before=s.p; let np=s.p*Math.exp(r);
  np=Math.min(s.prev*1.3,Math.max(s.prev*.7,np));
  s.p=np; const P=px(s);
  s.h=Math.max(s.h,P); s.l=Math.min(s.l,P);
  const sig=(s.v||.01)/Math.sqrt(MPD);
  const vm=Math.round(s.avgVol/MPD*u*rnd(.4,1.4)*(1+Math.min(6,Math.abs(r)/sig*.6)));
  s.vol+=vm; s.val+=vm*P; s.mins.push({p:P,v:vm});
  s.lastTick={p:P,q:Math.max(1,Math.round(vm*rnd(.01,.08))),up:np>=before};
  return Math.log(np/before);
}

function newsTags(tgt){return Object.entries(tgt).map(([k,v])=>({k,d:Math.sign(v)}));}
function pushNews(text,tgt,kind,overnight){

  S.news.push(n); if(S.news.length>400) S.news.shift();

}
function fireMacro(overnight){const [t,fx,d]=pick(MACRO);
  const tgt=scale2(fx,.8); if(overnight) gap(tgt); addEvent(scale(tgt,overnight),d,3); pushNews(t,fx,'macro',overnight);}
function fireSector(overnight){
  const k=pick(Object.keys(SEC_NEWS)), [t,dir]=pick(SEC_NEWS[k]);
  const imp=dir*rnd(.03,.06), tgt={['sec:'+k]:imp};
  if(overnight){ gap(tgt); addEvent(scale(tgt,1),3,3); pushNews(t,tgt,'sector',1); return; }

function fireStock(overnight){
  const s=pick(S.stocks.filter(x=>!x.kind));
  const pool=STOCK_NEWS.any.concat(STOCK_NEWS[s.s]||[], STOCK_NEWS[s.s]||[]);
  const [t,a,b]=s.s==='테마'&&R()<.7?pick(STOCK_NEWS['테마']):pick(pool);
  const imp=rnd(a,b), tgt={['code:'+s.code]:imp}, text=t.replace('{n}',s.n);
  if(overnight){ gap(tgt); addEvent(scale(tgt,1),2,2.5); pushNews(text,tgt,'stock',1); return; }
  newsWithTwists(text,tgt,'stock',imp,2,2.5,/공시|제휴|수주/.test(t)&&imp>0);}
// 뉴스에 현실적인 변수 추가: 선반영(가격이 먼저 움직임) · 재료소멸(호재 뒤 급락) · 오보 정정
function schedule(after,obj){ let d=S.day, m=S.minute+after; if(m>=MPD-3){ d++; m=5+(m-(MPD-3))%60; } S.pend.push(Object.assign({d,m},obj)); }
function newsWithTwists(text,tgt,kind,imp,days,tau,canFix){
  const dd=D();
  if(R()<dd.pre){ // 아는 사람들이 먼저 산다: 가격이 먼저 오르고, 뉴스는 나중에
    addEvent(scale2(tgt,.6),1,14); schedule(Math.floor(rnd(10,40)),{type:'news',text,tgt,kind,days,tau});
  } else { addEvent(tgt,days,tau); pushNews(text,tgt,kind); }
  if(imp>0&&R()<dd.fade) schedule(Math.floor(rnd(45,120)),{type:'fade',tgt,text});
  if(canFix&&R()<dd.fix) schedule(Math.floor(rnd(40,140)),{type:'fix',tgt,text});
}
function scale2(t,f){ const o={}; for(const k in t) o[k]=t[k]*f; return o; }
function fireEarn(s){
  const sur=gauss()*s.v*3.2, q=Math.floor(new Date(S.date).getMonth()/3);
  const qn=['4분기','1분기','2분기','3분기'][q];
  const t=sur>.03?`${s.n} ${qn} 실적 "어닝 서프라이즈"… 영업익 컨센서스 ${Math.round(sur*600)}% 상회`
         :sur<-.03?`${s.n} ${qn} 실적 "어닝 쇼크"… 영업익 컨센서스 ${Math.round(-sur*600)}% 하회`
         :`${s.n} ${qn} 실적 발표… 시장 예상치 부합`;
  addEvent({['code:'+s.code]:sur*1.3},2,2); pushNews(t,{['code:'+s.code]:sur||.001},'earn');
  s.nextEarn=S.day+Math.floor(rnd(55,65)); s.earnMin=Math.floor(rnd(30,380));
}
function scale(t,on){if(!on)return t; const o={}; for(const k in t)o[k]=t[k]*.4; return o;}
function gap(tgt){ // 밤사이 뉴스 → 시초가 갭
  S.stocks.forEach(s=>{ if(s.kind) return; let g=(tgt['code:'+s.code]||0)+(tgt['sec:'+s.s]||0)+s.b*(tgt.ALL||0);
    if(g){ s.p=Math.min(s.prev*1.3,Math.max(s.prev*.7,s.p*Math.exp(g*.6))); } });
}
const absMin=()=>(S.day-1)*MPD+S.minute;
function pumpStep(){
  const P=S.pump;
  if(!P){
    if(R()<D().pump){ const c=S.stocks.filter(x=>!x.kind&&(x.m==='KOSDAQ'||x.s==='테마')&&x.shares*x.prev<2e12);
      const s=pick(c); S.pump={code:s.code,n:s.n,t0:absMin(),len:Math.floor(rnd(90,220)),step:0}; }
    return;
  }
  const el=absMin()-P.t0, k='code:'+P.code;
  if(el<P.len){ effMap[k]=(effMap[k]||0)+.0016*(1+el/P.len); // 이유 없이 꾸준히 끌어올림
    if(P.step===0&&el>=Math.floor(P.len*.3)){ P.step=1; pushNews(`${P.n}, 뚜렷한 이유 없이 급등… 거래량 평소의 10배`,{[k]:.05},'stock'); }
    if(P.step===1&&el>=Math.floor(P.len*.75)){ P.step=2; pushNews(`⚠️ 한국거래소, ${P.n} 투자경고종목 지정`,{[k]:-.02},'fact'); }
  } else { addEvent({[k]:-rnd(.28,.42)},2,3); pushNews(`🚨 금융당국, ${P.n} 시세조종(작전) 혐의 조사 착수`,{[k]:-.3},'macro'); S.pump=null; }
}
function storyStep(){
  S.stories=S.stories||[];
  S.stories.forEach(st=>{ if(!st.done&&absMin()>=st.at) fireStory(st); });
  S.stories=S.stories.filter(st=>!st.done||absMin()-st.endAt<MPD*2); // 끝난 정세는 이틀간 표시
  const active=S.stories.filter(st=>!st.done).length;
  if(active<2&&R()<(active?.0006:.0018)){
    const busy=new Set(S.stories.map(x=>x.id)), cand=STORIES.map((_,i)=>i).filter(i=>!busy.has(i));
    if(cand.length){ const st={id:pick(cand),st:0,at:absMin(),hist:[]}; S.stories.push(st); fireStory(st); }
  }
}
function fireStory(st){
  const def=STORIES[st.id], stg=def.stages[st.st], tgt={};
  for(const k in stg.fx) tgt[k==='ALL'?'ALL':'sec:'+k]=stg.fx[k]*.6;
  addEvent(tgt,3,1.8);
  st.hist.push({st:st.st,day:S.day,min:S.minute});
  pushNews(`${def.icon} [${def.name}] ${stg.t}`,tgt,'story');
  if(!stg.next.length){ st.done=true; st.endAt=absMin(); return; }
  let r=R(),acc=0,ni=stg.next[stg.next.length-1][1];
  for(const [p,i] of stg.next){ acc+=p; if(r<acc){ ni=i; break; } }
  st.st=ni; st.at=absMin()+Math.floor(rnd(300,900)); st.cur=stg.t;
}
function rollNews(){
  storyStep();
  if(R()<.0013) fireMacro();
  if(R()<.006) fireSector();
  if(R()<.0085) fireStock();
  if(R()<.003){ // 시장에 도는 찌라시 (난이도에 따라 상당수가 가짜)
    const s=pick(S.stocks.filter(x=>!x.kind)), dir=R()<.5?1:-1, tpl=Math.floor(R()*3), fake=R()<D().fake, after=Math.floor(rnd(25,80));
    startRumor(s,dir,tpl,fake,after,'market'); }
  S.stocks.forEach(s=>{ if(s.nextEarn===S.day&&s.earnMin===S.minute) fireEarn(s); });
}

// ===================== 장 운영 =====================
function openDay(first){
  S.phase='open'; S.minute=0;
  if(!first) S.stocks.forEach(s=>{ s.prev=px(s); s.p=s.prev; });
  S.stocks.forEach(s=>{s.o=s.h=s.l=rt(s.prev); s.p=s.prev; s.vol=0; s.val=0; s.mins=[]; s.alerted=0;});
  S.idx.kp=S.idx.k; S.idx.qp=S.idx.q;

function obLevels(s){ // 호가 생성
  const P=px(s), t=tickSize(P), base=s.avgVol/MPD*.8+5, asks=[],bids=[];
  for(let k=1;k<=7;k++){ const ap=P+t*k-(k===1?0:0), bp=P-t*(k-1);
    asks.push({p:rt(ap),q:Math.round(base*uRnd(.3,1.8)*(1+k*.15))});
    bids.push({p:rt(bp),q:Math.round(base*uRnd(.3,1.8)*(1+k*.15))}); }
  return {asks:asks.filter(a=>a.p<=limUp(s)),bids:bids.filter(b=>b.p>=limDn(s))};
}
function fill(o,price){
  const s=byCode[o.code], amt=price*o.q, fee=amt*.00015;
  if(o.side==='buy'){
    if(o.credit){ if(equity()*LEV-holdVal()<amt*.999) return false; } else if(S.cash<amt+fee-1) return false;
    S.cash-=amt+fee; const h=S.holds[o.code]||{q:0,avg:0};
    h.avg=(h.avg*h.q+price*o.q)/(h.q+o.q); h.q+=o.q; S.holds[o.code]=h;
  } else {
    const h=S.holds[o.code]; if(!h||h.q<o.q) return false;
    const tax=amt*.0018, net=amt-fee-tax, pl=net-h.avg*o.q;
    S.cash+=net; h.q-=o.q; S.realized+=pl; S.todayRealized=(S.todayRealized||0)+pl;
    if(!h.q) delete S.holds[o.code];
    o.pl=pl;
  }
  S.fills.unshift({day:S.day,min:S.minute,code:o.code,n:s.n,side:o.side,price,q:o.q,pl:o.pl}); if(S.fills.length>200) S.fills.pop();
  toast({lb:o.forced?'⚠️ 반대매매':o.side==='buy'?(o.credit?'신용 매수':'매수 체결'):'매도 체결',col:o.forced?'#e8a400':o.side==='buy'?'var(--red)':'var(--blue)',
    title:`${s.n} ${o.q.toLocaleString()}주 · ${fmt(price)}원`,
    foot:o.side==='sell'?`실현손익 <b class="${cls(o.pl)}">${won(o.pl,1)}</b>`:`총 ${won(price*o.q)}`,code:o.code});
  return true;
}
function placeOrder(){
  const s=S.stocks[sel];
  if(S.bankrupt) return toast({lb:'파산',col:'#5f6777',title:'파산해서 더 이상 거래할 수 없어요'});
  if(MODE==='multi'&&MP.ended) return toast({lb:'안내',col:'#5f6777',title:'게임이 끝났어요'});
  if(S.phase!=='open') return toast({lb:'안내',col:'#5f6777',title:'장이 마감됐어요. 다음 거래일에 주문해주세요.'});
  const q=Math.floor(+$('oQty').value); if(!(q>0)) return toast({lb:'안내',col:'#5f6777',title:'수량을 입력해주세요'});
  const ob=obLevels(s);
  if(otype==='market'){
    const price=side==='buy'?(ob.asks[0]?.p??px(s)):(ob.bids[0]?.p??px(s));
    if(side==='buy'&&price*q*1.00015>buyPower()) return toast({lb:'주문 실패',col:'#5f6777',title:'주문가능 금액이 부족해요'});
    if(side==='sell'&&q>(S.holds[s.code]?.q||0)-lockedSell(s.code)) return toast({lb:'주문 실패',col:'#5f6777',title:'매도 가능 수량이 부족해요'});
    fill({side,code:s.code,q,credit:side==='buy'&&credit},price);
  } else {
    let price=rt(parseNum($('oPrice').value));
    if(price>limUp(s)||price<limDn(s)) return toast({lb:'주문 실패',col:'#5f6777',title:`가격은 하한가 ${fmt(limDn(s))} ~ 상한가 ${fmt(limUp(s))} 사이여야 해요`});
    if(side==='buy'){
      if(price*q*1.00015>buyPower()) return toast({lb:'주문 실패',col:'#5f6777',title:'주문가능 금액이 부족해요'});
      const ask=ob.asks[0]?.p??px(s);
      if(price>=ask) fill({side,code:s.code,q,credit},ask);
      else { S.orders.push({id:S.oid++,side,code:s.code,price,q,day:S.day,min:S.minute,credit}); toast({lb:'주문 접수',col:'#5f6777',title:`${s.n} ${q}주 ${fmt(price)}원 매수 대기`,foot:'가격이 내려오면 자동 체결돼요',code:s.code}); }
    } else {
      if(q>(S.holds[s.code]?.q||0)-lockedSell(s.code)) return toast({lb:'주문 실패',col:'#5f6777',title:'매도 가능 수량이 부족해요'});
      const bid=ob.bids[0]?.p??px(s);
      if(price<=bid) fill({side,code:s.code,q},bid);
      else { S.orders.push({id:S.oid++,side,code:s.code,price,q,day:S.day,min:S.minute}); toast({lb:'주문 접수',col:'#5f6777',title:`${s.n} ${q}주 ${fmt(price)}원 매도 대기`,foot:'가격이 올라오면 자동 체결돼요',code:s.code}); }
    }
  }
  renderAll();
}
function processOrders(){
  S.orders=S.orders.filter(o=>{ const P=px(byCode[o.code]);
    if((o.side==='buy'&&P<=o.price)||(o.side==='sell'&&P>=o.price)){ fill(o,o.price); return false; } return true; });
}
const buyPower=()=>credit?creditAvail():avail();
function checkMargin(){
  if(S.bankrupt) return;
  if(S.cash<0&&holdVal()<-S.cash*D().mc){ // 담보비율 미달 → 반대매매
    S.orders=S.orders.filter(o=>o.side==='sell');
    const list=Object.keys(S.holds).sort((a,b)=>S.holds[b].q*px(byCode[b])-S.holds[a].q*px(byCode[a]));
    let n=0;
    for(const c of list){
      if(S.cash>=0||holdVal()>=-S.cash*MARGIN_OK) break;
      S.orders=S.orders.filter(o=>o.code!==c);
      const h=S.holds[c]; if(h&&fill({side:'sell',code:c,q:h.q,forced:1},px(byCode[c]))) n++;
    }
    if(n) toast({lb:'⚠️ 반대매매',col:'#e8a400',title:`담보비율이 ${Math.round(D().mc*100)}% 아래로 떨어져 ${n}개 종목이 강제로 팔렸어요`});
  }
  if(equity()<=0) goBankrupt();
}

function spark(s){
  const d=s.mins; if(d.length<2) return '';
  const N=40, step=Math.max(1,Math.floor(MPD/N)), pts=[]; let lo=s.prev,hi=s.prev;
  for(let i=0;i<d.length;i+=step){pts.push([i,d[i].p]); lo=Math.min(lo,d[i].p); hi=Math.max(hi,d[i].p);}
  pts.push([d.length-1,d[d.length-1].p]);
  const W=60,H=26,r=hi-lo||1, Y=v=>H-2-(v-lo)/r*(H-4), X=i=>i/MPD*W;
  const c=d[d.length-1].p>=s.prev?'#f04452':'#3182f6';
  return `<svg width="${W}" height="${H}"><line x1="0" x2="${W}" y1="${Y(s.prev)}" y2="${Y(s.prev)}" stroke="#3a404c" stroke-dasharray="2 2"/><polyline fill="none" stroke="${c}" stroke-width="1.4" points="${pts.map(([i,v])=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/></svg>`;
}

function chartData(s){
  if(chartMode==='min') return s.mins.map((m,i)=>({c:m.p,v:m.v,i}));
  if(chartMode==='m5'){ const out=[]; for(let i=0;i<s.mins.length;i+=5){ const g=s.mins.slice(i,i+5);
      out.push({o:i?s.mins[i-1].p:g[0].p,c:g[g.length-1].p,h:Math.max(...g.map(x=>x.p)),l:Math.min(...g.map(x=>x.p)),v:g.reduce((a,x)=>a+x.v,0),t:hm(i)}); } return out; }
  const today={o:s.o,h:s.h,l:s.l,c:px(s),v:s.vol,date:S.date,today:1};
  const days=s.daily.concat(S.phase==='open'?[today]:[]);
  if(chartMode==='day') return days.slice(-70).map(d=>({...d,t:fmtDate(d.date).slice(5,10)}));
  const wk=[]; for(let i=Math.max(0,days.length-260);i<days.length;i+=5){ const g=days.slice(i,i+5);
    wk.push({o:g[0].o,c:g[g.length-1].c,h:Math.max(...g.map(x=>x.h)),l:Math.min(...g.map(x=>x.l)),v:g.reduce((a,x)=>a+x.v,0),t:fmtDate(g[0].date).slice(5,10)}); }
  return wk;
}
function drawChart(){
  const s=S.stocks[sel], c=$('chart'), dpr=devicePixelRatio||1, W=c.clientWidth, H=c.clientHeight;
  if(c.width!==W*dpr||c.height!==H*dpr){c.width=W*dpr;c.height=H*dpr;}
  const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const d=chartData(s); if(!d.length) return;
  const R=W-64, PH=H*.74, VT=H*.8, VH=H*.18;
  let lo=Infinity,hi=-Infinity;
  d.forEach(p=>{lo=Math.min(lo,p.l??p.c);hi=Math.max(hi,p.h??p.c);});
  if(chartMode==='min'){lo=Math.min(lo,s.prev);hi=Math.max(hi,s.prev);}
  const h=S.holds[s.code]; if(h&&chartMode!=='week'){ if(h.avg>lo*.9&&h.avg<hi*1.1){lo=Math.min(lo,h.avg);hi=Math.max(hi,h.avg);} }
  const pad=(hi-lo)*.08||hi*.01; lo-=pad; hi+=pad;
  const N=chartMode==='min'?MPD:chartMode==='m5'?MPD/5:Math.max(d.length,30);
  const X=i=>6+(i+.5)/N*(R-12), Y=v=>8+(hi-v)/(hi-lo)*(PH-8);
  const vmax=Math.max(...d.map(p=>p.v),1);
  // 그리드
  x.font='11px "Noto Sans KR",sans-serif'; x.fillStyle='#5f6777'; x.strokeStyle='#22262e'; x.lineWidth=1;
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v); x.beginPath(); x.moveTo(0,y); x.lineTo(R,y); x.stroke(); x.fillText(fmt(v),R+6,y+4);}
  if(chartMode==='min'){ ['09:00','11:00','13:00','15:00'].forEach((t,k)=>{const i=[0,120,240,360][k]; x.fillText(t,X(i)-14,H-2);}); }
  else { const step=Math.ceil(d.length/6); d.forEach((p,i)=>{ if(i%step===0&&p.t) x.fillText(p.t,X(i)-14,H-2); }); }
  // 거래량
  d.forEach((p,i)=>{ const up=chartMode==='min'?(i?p.c>=d[i-1].c:true):p.c>=p.o; x.fillStyle=up?'rgba(240,68,82,.45)':'rgba(49,130,246,.45)';
    const bw=Math.max(1,(R-12)/N*.7), bh=p.v/vmax*VH; x.fillRect(X(i)-bw/2,VT+VH-bh,bw,bh); });
  if(chartMode==='min'){
    const yb=Y(s.prev); x.setLineDash([4,4]); x.strokeStyle='#4a505c'; x.beginPath(); x.moveTo(0,yb); x.lineTo(R,yb); x.stroke(); x.setLineDash([]);
    x.fillStyle='#5f6777'; x.fillText('전일 '+fmt(s.prev),R-80,yb-4);
    const last=d[d.length-1].c, col=last>=s.prev?'#f04452':'#3182f6';
    const g=x.createLinearGradient(0,0,0,PH); g.addColorStop(0,col+'33'); g.addColorStop(1,col+'00');
    x.beginPath(); d.forEach((p,i)=>i?x.lineTo(X(i),Y(p.c)):x.moveTo(X(i),Y(p.c))); x.lineTo(X(d.length-1),PH); x.lineTo(X(0),PH); x.closePath(); x.fillStyle=g; x.fill();
    x.beginPath(); d.forEach((p,i)=>i?x.lineTo(X(i),Y(p.c)):x.moveTo(X(i),Y(p.c))); x.strokeStyle=col; x.lineWidth=1.8; x.stroke();
    if(S.phase==='open'){ x.beginPath(); x.arc(X(d.length-1),Y(last),3.5,0,7); x.fillStyle=col; x.fill(); }
  } else {
    const bw=Math.max(1.5,(R-12)/N*.65);
    d.forEach((p,i)=>{ const up=p.c>=p.o, col=up?'#f04452':'#3182f6'; x.strokeStyle=x.fillStyle=col;
      x.beginPath(); x.moveTo(X(i),Y(p.h)); x.lineTo(X(i),Y(p.l)); x.stroke();
      const y1=Y(Math.max(p.o,p.c)), y2=Y(Math.min(p.o,p.c)); x.fillRect(X(i)-bw/2,y1,bw,Math.max(1,y2-y1)); });
  }
  // 현재가 라벨
  const cur=px(s), yc=Y(cur), cc=cur>=s.prev?'#f04452':'#3182f6';
  if(yc>0&&yc<PH){ x.fillStyle=cc; x.fillRect(R+1,yc-9,63,18); x.fillStyle='#fff'; x.fillText(fmt(cur),R+6,yc+4); }
  // 평단 & 주문선
  if(h){ const y=Y(h.avg); if(y>0&&y<PH){ x.setLineDash([6,4]); x.strokeStyle='#f5b942'; x.lineWidth=1.3; x.beginPath(); x.moveTo(0,y); x.lineTo(R,y); x.stroke(); x.setLineDash([]); x.fillStyle='#f5b942'; x.fillText('내 평단 '+fmt(h.avg),4,y-4);} }
  S.orders.filter(o=>o.code===s.code).forEach(o=>{ const y=Y(o.price); if(y>0&&y<PH){ x.setLineDash([2,3]); x.strokeStyle=o.side==='buy'?'#f04452':'#3182f6'; x.beginPath(); x.moveTo(0,y); x.lineTo(R,y); x.stroke(); x.setLineDash([]); x.fillStyle=x.strokeStyle; x.fillText(`${o.side==='buy'?'매수':'매도'} 대기 ${fmt(o.price)}`,R-120,y-4);} });
  // 크로스헤어
  if(hover){ const i=Math.round((hover.x-6)/(R-12)*N-.5);
    if(i>=0&&i<d.length){ const p=d[i], xx=X(i);
      x.strokeStyle='#596070'; x.setLineDash([3,3]); x.beginPath(); x.moveTo(xx,0); x.lineTo(xx,H-14); x.moveTo(0,hover.y); x.lineTo(R,hover.y); x.stroke(); x.setLineDash([]);
      const lines=chartMode==='min'?[hm(i),`가격 ${fmt(p.c)}`,`등락 ${pct(p.c/s.prev-1)}`,`거래량 ${fmtVol(p.v)}`]
        :[p.t||'',`시 ${fmt(p.o)}  고 ${fmt(p.h)}`,`저 ${fmt(p.l)}  종 ${fmt(p.c)}`,`거래량 ${fmtVol(p.v)}`];
      const bw=150, bx=xx+12+bw>R?xx-12-bw:xx+12;
      x.fillStyle='rgba(30,34,42,.95)'; x.fillRect(bx,10,bw,lines.length*17+10); x.fillStyle='#e9ecf1';
      lines.forEach((l,k)=>x.fillText(l,bx+8,26+k*17)); } }
}

function rumorImp(s,dir){ return dir*Math.min(.2,.07+.07*(s.v/.05)); }
function startRumor(s,dir,tpl,fake,after,src){
  const imp=rumorImp(s,dir), text=RUMOR_TPL[dir][tpl].replace('{n}',s.n);
  addEvent({['code:'+s.code]:imp},1,8);

}

function resolvePending(){
  if(!S.pend||!S.pend.length) return;
  S.pend=S.pend.filter(p=>{ if(p.d!==S.day||p.m!==S.minute) return true;
    if(p.type==='news'){ addEvent(scale2(p.tgt,.4),p.days,p.tau); pushNews(p.text,p.tgt,p.kind); return false; }
    if(p.type==='fade'){ addEvent(scale2(p.tgt,-.55),1,10); const nm=tagNm(p.tgt); pushNews(`${nm}, 차익실현 매물 쏟아지며 상승분 반납 (재료 소멸)`,scale2(p.tgt,-1),'stock'); return false; }

}
function gclock(now){
  const block=MPD*ROOM.msPerMin+ROOM.breakMs, el=now-ROOM.startAt;
  if(el<0) return {pre:true,d:0,m:0,left:-el};
  const d=Math.floor(el/block), w=el%block;
  if(d>=ROOM.days) return {ended:true,d:ROOM.days-1,m:MPD};
  return {d,m:Math.min(MPD,Math.floor(w/ROOM.msPerMin)),brk:w>=MPD*ROOM.msPerMin,nextIn:block-w,dayLeft:MPD*ROOM.msPerMin-w};
}
function advanceTo(t){

      if(S.minute<MPD&&(cd<t.d||S.minute<t.m)){ stepMinute(); n++; continue; }
      if(S.minute>=MPD){ engineClose(); continue; }
      break;
    }
    if(cd<t.d&&cd+1<ROOM.days){ S.date=nextDate(S.date); S.day++; openDay(); continue; }
    break;
  }
  return n;
}

async function multiSync(restore){
  if(!ROOM||MP.busy||!AUTH||!AUTH.token) return; MP.busy=true; const t0=Date.now();
  try{
    const eq=MP.built&&S?equity():SEED;
    const st=MP.built&&S?{equity:Math.round(eq),ret:+((eq/SEED-1)*100).toFixed(2),bankrupt:!!S.bankrupt,final:MP.ended,day:S.day,minute:S.minute,acct:pickAcct()}:null;
    if(st) st.acct.fills=st.acct.fills.slice(0,15);
    const r=await api({action:'room_sync',code:ROOM.code,id:AUTH.id,token:AUTH.token,st,restore:!!restore});
    const t1=Date.now();
    if(!r.ok){ if(r.relogin) return kicked(); if(r.gone) leaveRoomLocal(r.error); return; }
    if(t1-t0<=MP.rtt*1.3){ MP.offset=r.serverTime-(t0+t1)/2; MP.rtt=t1-t0; }
    onRoom(r.room,r.players,r.mine);
  }catch(e){ /* 네트워크 오류 → 다음 주기에 다시 시도 */ }
  finally{ MP.busy=false; }
}

  const s=S.stocks[sel];
  $('rumorBody').innerHTML=`<h2>📱 찌라시 뿌리기</h2><div class="sub">대상 종목 <b style="color:var(--text)">${s.n}</b> · 남은 찌라시 ${S.cards}장</div>
    <div class="seg" style="grid-template-columns:1fr 1fr"><button data-d="1" class="${rumorDir===1?'on':''}">📈 호재 소문</button><button data-d="-1" class="${rumorDir===-1?'on':''}">📉 악재 소문</button></div>
    <div class="plist" id="tplList">${RUMOR_TPL[rumorDir].map((t,i)=>`<div style="cursor:pointer;${i===rumorTpl?'outline:1.5px solid var(--blue)':''}" data-t="${i}">${t.replace('{n}',s.n)}</div>`).join('')}</div>
    <div class="rules">🤫 익명으로 퍼져요. 약 3초 뒤 모든 참가자의 시장에서 ${s.n} 주가가 크게 ${rumorDir>0?'올라요':'내려요'}.<br>🔍 게임 시간 30~60분 뒤 <b>사실무근</b>으로 밝혀지면 주가가 되돌아가요.<br>💡 ${rumorDir>0?'미리 사두고 찌라시로 띄운 뒤 팩트체크 전에 팔면…?':'경쟁자가 많이 가진 종목을 노려보세요.'}<br>👀 누가 뿌렸는지는 게임이 끝나면 공개돼요.</div>
    <div class="lg-err" id="rmErr" style="margin-top:6px"></div>
    <div style="display:flex;gap:8px;margin-top:8px"><button style="flex:1;padding:11px" id="rmCancel">취소</button><button class="mbtn" style="flex:2;margin:0;background:#c7861a" id="rmSend">찌라시 뿌리기</button></div>`;
  $('rumorBody').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ rumorDir=+b.dataset.d; rumorTpl=0; drawRumor(); });
  $('tplList').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ rumorTpl=+b.dataset.t; drawRumor(); });
  $('rmCancel').onclick=()=>$('ovRumor').classList.remove('show');
  $('rmSend').onclick=async()=>{ const b=$('rmSend'); b.disabled=true; b.textContent='퍼뜨리는 중…';
    try{ const r=await api({action:'room_rumor',code:ROOM.code,id:AUTH.id,token:AUTH.token,stock:sel,dir:rumorDir,tpl:rumorTpl});
      if(!r.ok){ $('rmErr').textContent=r.error; b.disabled=false; b.textContent='찌라시 뿌리기'; return; }
      S.cards=r.left; $('ovRumor').classList.remove('show');
      const x=r.rumor; if(!MP.known[x.rid]){ MP.known[x.rid]=x; if(x.day<S.day||(x.day===S.day&&x.min<S.minute)){ rebuildMulti(); renderAll(); } }
      toast({lb:'📱 찌라시',col:'#c7861a',title:'찌라시를 퍼뜨렸어요. 곧 시장에 퍼져요…',foot:`${s.n} · 남은 찌라시 ${r.left}장`});
      renderScore();
    }catch(e){ $('rmErr').textContent='서버에 연결할 수 없어요'; b.disabled=false; b.textContent='찌라시 뿌리기'; } };
}
// ----- 게임 종료 -----
async function finishMulti(){
  $('ovDay').classList.remove('show'); $('ovRumor').classList.remove('show');
  await multiSync();
  setTimeout(async()=>{ await multiSync(); MP.results=true; renderResults(); $('ovEnd').classList.add('show'); },2500);
}
function renderResults(){
  const ps=MP.players.slice().sort((a,b)=>(a.bankrupt-b.bankrupt)||(b.equity-a.equity));
  const meIdx=ps.findIndex(p=>p.id===AUTH.id), me=ps[meIdx], win=ps.find(p=>!p.bankrupt);
  const title=me&&me.bankrupt?'💸 파산으로 탈락':win&&win.id===AUTH.id?'🏆 우승!':`${meIdx+1}위`;
  const rumors=Object.values(MP.known).sort((a,b)=>a.rid-b.rid);
  $('endBody').innerHTML=`<div style="text-align:center"><div style="font-size:56px">${me&&me.bankrupt?'💸':win&&win.id===AUTH.id?'🏆':'🏁'}</div><h2>${title}</h2>
    <div class="sub">방 ${ROOM.code} · ${ROOM.days}거래일 종료</div></div>
    ${ps.map((p,i)=>`<div class="rk-row ${p.id===AUTH.id?'me':''}"><div class="no top">${p.bankrupt?'💀':['🥇','🥈','🥉'][i]||i+1}</div>
      <div class="nm"><b>${esc(p.nick)}${p.id===AUTH.id?' (나)':''}</b><small>${p.bankrupt?'파산':'생존'}</small></div>
      <div class="v"><b>${p.bankrupt?'-':won(p.equity)}</b><small class="${cls(p.ret)}">${p.bankrupt?'':`${p.ret>0?'+':''}${(+p.ret).toFixed(2)}%`}</small></div></div>`).join('')}
    ${rumors.length?`<div class="mlist" style="margin-top:12px"><h4>📱 찌라시 유포자 공개</h4>${rumors.map(r=>{ const s=S.stocks[r.s];
      return `<div><span style="font-size:12.5px">${RUMOR_TPL[r.dir][r.tpl].replace('{n}',s?s.n:'?')}</span><b>${r.nick?esc(r.nick):'…'}</b></div>`;}).join('')}</div>`:''}
    <button class="mbtn" id="endBack">로비로 돌아가기</button>`;
  $('endBack').onclick=()=>{ $('ovEnd').classList.remove('show'); MP.results=false; leaveRoomLocal(); };
}

// ===================== 시작 =====================
(async function boot(){
  let a=null; try{ a=JSON.parse(localStorage.getItem('gaemi_auth')); }catch(_){}
  if(a&&a.guest){ AUTH=a; return showMode(); }
  if(a&&a.token&&API_URL){
    AUTH=a;
    try{ const r=await api({action:'load',id:a.id,token:a.token});
      if(r.ok){ AUTH.nickname=r.nickname; soloServerSave=r.save; return showMode(); }
      AUTH=null; try{localStorage.removeItem('gaemi_auth');}catch(_){} return showLogin(r.error);
    }catch(e){ showMode(); toast({lb:'오프라인',col:'#5f6777',title:'서버에 연결할 수 없어요. 솔로 모드는 이 기기 저장본으로 할 수 있어요',time:' '}); return; }
  }
  showLogin();
})();

</script>
